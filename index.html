<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NÚCLEO SONORO - ESTUDIO IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        /* Contenedor absoluto para Vanta.js */
        #vanta-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }
        .welcome-box {
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(15px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #ffffff; }
        p { color: #d6e022; font-size: 1.2rem; }
    </style>
</head>
<body>

    <!-- Contenedor del fondo interactivo -->
    <div id="vanta-bg"></div>

    <div class="welcome-box">
        <h1>NÚCLEO SONORO ESTUDIO IA</h1>
        <p>Fase 1: Verificando el fondo interactivo Vanta.js</p>
    </div>

    <!-- Scripts locales o CDN de Three.js y Vanta -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
    <script>
        VANTA.BIRDS({
          el: "#vanta-bg",
          mouseControls: true,
          touchControls: true,
          gyroControls: false,
          minHeight: 200.00,
          minWidth: 200.00,
          scale: 1.00,
          scaleMobile: 1.00,
          backgroundColor: 0x8eabcc,
          color1: 0x1023a9,
          color2: 0xd6e022,
          colorMode: "lerp",
          alignment: 40.00,
          cohesion: 5.00
        });
    </script>
</body>
</html>
